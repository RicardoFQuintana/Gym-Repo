<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
            line-height: 1.25rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            min-height: 2.5rem;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-icon {
            margin-right: 0.5rem;
        }

        .input-field {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
            min-height: 2.5rem;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen">
        <aside id="sidebar"
            class="bg-gray-800 text-white w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out z-50">
            <!-- Logo -->
            <div class="flex items-center space-x-2 px-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-dumbbell-icon lucide-dumbbell">
                    <path
                        d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
                    <path d="m2.5 21.5 1.4-1.4" />
                    <path d="m20.1 3.9 1.4-1.4" />
                    <path
                        d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
                    <path d="m9.6 14.4 4.8-4.8" />
                </svg>
                <span class="text-2xl font-extrabold">CuerpoSano</span>
            </div>

            <!-- Navegación -->
            <nav class="space-y-2">
                <a href="clases.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-white hover:bg-gray-600 transition duration-200">
                    <span>Clases</span>
                </a>
                <a href="actividades.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Actividades</span>
                </a>
                <a href="Entrenadores.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Entrenadores</span>
                </a>
                <a href="miembros.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Miembros</span>
                </a>
                <a href="reporte-ingresos.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Reporte de Ingresos</span>
                </a>
                <a href="reporte-asistencia.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Reporte de Asistencia</span>
                </a>
            </nav>

            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-700">
                <button class="w-full btn btn-danger">Cerrar Sesión</button>
            </div>
        </aside>
        <div class="flex-1 flex flex-col">
            <main class="flex-1 p-4 lg:p-6">
                <div class="flex flex-col space-y-6">
                    <!-- Header -->
                    <div class="flex-1 flex flex-wrap flex-col md:flex-row justify-between items-center gap-4">
                        <h1 class="text-3xl font-bold tracking-tight">Reporte de Asistencia</h1>
                        <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                            <div class="flex gap-2">
                                <input type="date" class="input-field flex-1" id="dateFrom" />
                                <input type="date" class="input-field flex-1" id="dateTo" />
                            </div>
                            <button class="btn btn-primary mt-2 sm:mt-0" id="exportarPdf">
                                Exportar PDF
                            </button>
                        </div>
                    </div>

                    <!-- Form -->
                    <div class="border border-gray-200 rounded-xl shadow-sm bg-white">
                        <div class="flex flex-col space-y-6 py-6">
                            <div class="flex flex-col space-y-2 px-6">
                                <div class="flex items-center space-x-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" class="lucide lucide-user-check h-5 w-5"
                                        aria-hidden="true">
                                        <path d="m16 11 2 2 4-4"></path>
                                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="9" cy="7" r="4"></circle>
                                    </svg>
                                    <span class="leading-none font-semibold">Registrar Asistencia</span>
                                </div>
                                <p class="text-muted-foreground text-sm">Busca al miembro por DNI para registrar su
                                    asistencia
                                </p>
                            </div>
                            <div class="px-6">
                                <form id="asistenciaForm">
                                    <div class="flex flex-col items-start space-y-6">
                                        <div class="w-full grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                                            <div class="flex flex-col space-y-2 relative">
                                                <label for="miembroDNI" class="leading-none font-medium select-none">DNI
                                                    del
                                                    Miembro
                                                    (*)</label>
                                                <input type="text" id="miembroDNI" name="miembroDNI" class="input-field"
                                                    placeholder="Ingrese el DNI" list="miembrosDatalist" required />
                                                <datalist id="miembrosDatalist"></datalist>
                                            </div>
                                            <input type="text" id="miembroId" class="hidden">
                                            <div class="flex flex-col space-y-2 relative">
                                                <label for="miembroNombre"
                                                    class="leading-none font-medium select-none">Nombre
                                                    Completo</label>
                                                <input type="text" id="miembroNombre" readonly name="miembroNombre"
                                                    class="input-field focus-visible:outline-0 cursor-not-allowed" placeholder="Ingrese el nombre" required />
                                            </div>

                                            <div class="flex flex-col space-y-2 relative">
                                                <label for="actividadId"
                                                    class="leading-none font-medium select-none">Actividad
                                                    (Opcional)</label>
                                                <select name="actividad" id="actividadId" class="input-field">
                                                    <option value="">-- Seleccione una actividad --</option>
                                                </select>
                                            </div>

                                            <div class="flex flex-col space-y-2 relative">
                                                <label for="claseId"
                                                    class="leading-none font-medium select-none">Clase</label>
                                                <select name="clase" id="claseId" class="input-field" disabled>
                                                    <option value="">-- Seleccione una clase --</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-primary">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                                                <path d="m16 11 2 2 4-4"></path>
                                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                                <circle cx="9" cy="7" r="4"></circle>
                                            </svg>
                                            Registrar Asistencia
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

            </main>
        </div>
    </div>
    <script src="../HTML/JS/reporte-asistencia.js"></script>

</body>

</html>
