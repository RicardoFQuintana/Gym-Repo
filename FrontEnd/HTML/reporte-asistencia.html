<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte de Asistencia - CuerpoSano</title>
  <link rel="stylesheet" href="../HTML/CSS/style.css" />
</head>

<body>
  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- SIDEBAR -->
  <div id="aside-placeholder"></div>

  <!-- OVERLAY -->
  <div id="overlay" class="overlay"></div>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <main class="main-container content-wrapper">

    <section class="gestor">

      <!-- ===================== FILTROS + BOTONES ===================== -->
      <div class="btn-row Reporte">
        <h1>Reporte de Asistencia</h1>


        <!-- FILTRO MIEMBRO -->
        <div class="card-filtro">
          <label>Miembro</label>
          <select id="filtro-miembro">
            <option value="todos">Todos</option>
          </select>
        </div>

        <!-- FILTRO CLASE -->       
        <div class="card-filtro">
          <label>Clase</label>
          <select id="filtro-clase">
            <option value="todas">Todas</option>
          </select>
        </div>

        <!-- FILTRO PERIODO -->
        <div class="card-filtro">
          <label>Período</label>
          <select id="filtro-periodo">
            <option value="todos" selected>-----</option>
            <option value="diario">Diario</option>
            <option value="semanal">Semanal</option>
            <option value="mensual">Mensual</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
            <option value="rango">Rango Personalizado</option>
          </select>
        </div>

        <!-- FECHAS -->
        <div id="rango-fechas-inicio" class="card-filtro oculto">
          <label>Desde</label>
          <input type="date" id="fecha-desde" />
        </div>

        <div id="rango-fechas-fin" class="card-filtro oculto">
          <label>Hasta</label>
          <input type="date" id="fecha-hasta" />
        </div>

        <!-- APLICAR FILTROS -->
        <button id="btn-aplicar-filtros" class="btn btn-save svg" data-tooltip="Aplicar Filtros">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search">
            <path d="m21 21-4.34-4.34"/>
            <circle cx="11" cy="11" r="8"/>
          </svg>
        </button>

        <!-- REGISTRAR ASISTENCIA -->
        <button id="btnRegistrar" class="btn btn-save svg" data-tooltip="Registrar Asistencia">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

        <!-- EXPORTAR PDF -->
        <button id="btnExportarPDF" class="btn btn-save svg" data-tooltip="Exportar PDF">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer">
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/>
            <rect x="6" y="14" width="12" height="8" rx="1"/>
          </svg>
        </button>
      </div>

      <!-- ===================== MÉTRICAS ===================== -->
      <div class="metricas-contenedor">
        <div class="card-metrica">
          <h2>Asistencia Diario</h2>
          <p id="metric-dia">0</p>
        </div>

        <div class="card-metrica">
          <h2>Asistencia Mensual</h2>
          <p id="metric-mes">0</p>
        </div>

        <div class="card-metrica">
          <h2>Asistencia Trimestral</h2>
          <p id="metric-tri">0</p>
        </div>

        <div class="card-metrica">
          <h2>Asistencia Anual</h2>
          <p id="metric-anio">0</p>
        </div>
      </div>

      <!-- ===================== MODAL REGISTRAR ===================== -->
      <div id="modalAsistencia" class="modal">
        <div class="modal-content pago" id="asistenciaForm">

          <h2>Registrar Asistencia</h2>

          <div class="form-group">
            <label for="modal-dni">DNI / Código:</label>
            <input type="text" id="modal-dni" required placeholder="Ej: 44111222" />
          </div>

          <div class="form-group">
            <label for="modal-nombre">Nombre:</label>
            <input type="text" id="modal-nombre" placeholder="Nombre del miembro" />
          </div>

          <div class="form-group">
            <label for="modal-clase">Clase:</label>
            <select id="modal-clase">
              <option value="">-- Ninguna --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="modal-metodo">Método:</label>
            <select id="modal-metodo">
              <option value="0">Código de Barras</option>
              <option value="1">Huella Digital</option>
              <option value="2">Manual</option>
            </select>
          </div>

          <div class="btn-group">
            <button type="button" id="cancelarAsistenciaBtn" class="btn btn-secondary svg">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
              Cancelar
            </button>

            <button type="button" id="guardarAsistenciaBtn" class="btn btn-save svg">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              Registrar
            </button>
          </div>

        </div>
      </div>

      <!-- ===================== TABLA ===================== -->
      <div class="tabla-wrapper">
        <table class="tabla-gestion">
          <thead>
            <tr>
              <th>Miembro</th>
              <th>DNI</th>
              <th>Clase</th>
              <th>Fecha / Hora</th>
              <th>Método</th>
            </tr>
          </thead>

          <tbody id="tabla-body"></tbody>
        </table>
        <!-- PAGINACIÓN -->
        <div id="paginacion" class="pagination"></div>
      </div>
    </section>

    <section id="graficosAsistencia" class="graficos-container">

      <!-- VISTA GENERAL -->
      <h2>Vista General</h2>
      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartBarrasClases"></canvas>
        </div>
      </div>

      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartLineaTendencia"></canvas>
        </div>
      </div>

      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartDonutClases"></canvas>
        </div>
      </div>

      <!-- VISTA POR MIEMBRO -->
      <h2>Vista por Miembro</h2>
      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartLineaMiembro"></canvas>
        </div>
      </div>

      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartBarrasMiembro"></canvas>
        </div>
      </div>

      <!-- VISTA POR CLASE -->
      <h2>Vista por Clase</h2>
      <div class="grafico-card">
        <div class="grafico-wrapper">
          <canvas id="chartBarrasRanking"></canvas>
        </div>
      </div>

    </section>
    <!-- ================= AUTH ================= -->
    <div id="auth-placeholder"></div>

  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- SCRIPTS -->
  <script src="../HTML/JS/index.js"></script>
  <script src="../HTML/JS/utils.js"></script>
  <script src="../HTML/JS/loadComponents.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix"></script>
  <script src="../HTML/JS/reporte-asistencia.js"></script>
</body>
</html>
