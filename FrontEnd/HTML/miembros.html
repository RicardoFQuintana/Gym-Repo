<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Miembros - CuerpoSano</title>
    <link rel="stylesheet" href="../HTML/CSS/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <div id="header-placeholder"></div>

    <!-- ================= SIDEBAR ================= -->
    <div id="aside-placeholder"></div>

    <!-- ================= OVERLAY ================= -->
    <div id="overlay" class="overlay"></div>

    <main class="main-container content-wrapper">
        <section class="gestor">

            <div class="btn-row">
                <button id="abrirMiembroBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Nuevo Miembro</button>
                <h1>Gestión de Miembros</h1>
                <button id="buscarMiembroBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar Miembro</button>
            </div>

            <div id="modalMiembro" class="modal modal-miembro">
                <div class="modal-content miembro form-horizontal" id="miembroForm">

                    <input type="hidden" id="miembroId" />

                    <!-- ===========================
                        1️⃣ Fila — Nombre / Apellido
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" required placeholder="Ej: Ana" />
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido:</label>
                            <input type="text" id="apellido" required placeholder="Ej: Gómez" />
                        </div>
                    </div>

                    <!-- ===========================
                        2️⃣ Fila — DNI / Dirección
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dni">DNI:</label>
                            <input type="text" id="dni" required  placeholder="Ej: 43107996"/>
                        </div>
                        <div class="form-group">
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" required  placeholder="Ej: calle x"/>
                        </div>
                    </div>

                    <!-- ===========================
                        3️⃣ Fila — Teléfono / Fecha Nac.
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="text" id="telefono"  required placeholder="Ej: 1122334455"/>
                        </div>
                        <div class="form-group">
                            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                            <input type="date" id="fechaNacimiento"  required/>
                        </div>
                    </div>

                    <!-- ===========================
                        4️⃣ Fila — Tipo Membresía / Descuento
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tipoMembresia">Tipo de Membresía:</label>
                            <select id="tipoMembresia"  required></select>
                        </div>

                        <div class="form-group">
                            <label for="descuento">Descuento:</label>
                            <select id="descuento"  required></select>
                        </div>
                    </div>

                    <!-- ===========================
                        5️⃣ Fila — Elegir Foto / Método Pago
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fotoFile">Elegir Foto:</label>
                            <input type="file" id="fotoFile" accept="image/*"  required/>
                        </div>
                        <div class="form-group">
                            <label for="metodoPago">Método de Pago:</label>
                            <select id="metodoPago" required>
                                <option value="">Seleccione una opción</option>
                                <option value="1">Efectivo</option>
                                <option value="2">Tarjeta de Crédito</option>
                                <option value="3">Transferencia</option>
                                <option value="4">Débito Automático</option>
                            </select>
                        </div>
                    </div>

                    <!-- ===========================
                        6️⃣ Fila — Entrenador Personal
                    ============================ -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="entrenadorPersonal">Entrenador Personal:</label>
                            <select id="entrenadorPersonal"></select>
                        </div>
                    </div>

                    <!-- Oculto: URL de foto (Base64) -->
                    <input type="hidden" id="urlFotoInput" />

                    <!-- Botones -->
                    <div class="btn-group">
                        <button type="button" id="cancelarFormBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                        <button type="button" id="guardarFormBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Guardar</button>
                    </div>

                </div>
            </div>

            <div id="modalConsulta" class="modal">
                <div class="modal-content">
                    <h2>Consultar Miembro</h2>
                    <input type="text" id="consultaDni" placeholder="Ingrese DNI del miembro">
                    <div class="btn-group">
                        <button id="cancelarConsultaBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                        <button id="confirmarConsultaBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar</button>
                    </div>
                </div>
            </div>

            <div id="modalDetalle" class="modal">
                <div class="modal-content">
                    <div id="detalleContenido" class="detalle-izquierda"></div>
                    <div class="btn-group">
                        <button id="btnEliminarDetalle" class="btn-small btn btn-delete" data-tooltip="Eliminar Miembro">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <button id="cerrarDetalleBtn" class="btn-small btn btn-secondary" data-tooltip="Cerrar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
                        </button>
                        <button id="btnEditarDetalle" class="btn-small btn btn-edit" data-tooltip="Editar Miembro">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen-line-icon lucide-file-pen-line"><path d="m18.226 5.226-2.52-2.52A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.351"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 18h1"/></svg>
                        </button>
                        <button id="btnCarnetDetalle" class="btn-small btn btn-save" data-tooltip="Ver Carnet">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card-icon lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                        </button>
                        <button id="btnImprimirDetalle" class="btn-small btn btn-save" data-tooltip="Imprimir PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer-icon lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="modalCarnet" class="modal" style="display: none;">
                <div class="modal-content" style="max-width: 600px;">
                    <span id="cerrarCarnetBtn" class="close-btn">&times;</span>
            
                    <div id="carnetImprimible" style="border: 2px solid #333; padding: 20px; text-align: center; background-color: #f7f7f7;">
                        <h3 style="margin-bottom: 5px; color: #007bff;">GYM ACCESS PASS</h3>
                        <p id="carnetNombre" style="font-size: 1.2em; font-weight: bold; margin: 5px 0;"></p>
            
                        <div style="display: flex; justify-content: space-around; align-items: center; margin: 15px 0;">
                            <img id="carnetFoto" src="" alt="Foto" style="width: 80px; height: 80px; object-fit: cover; border: 1px solid #ccc;">
                            <div style="text-align: left;">
                                <p style="margin: 2px 0; font-size: 0.9em;">**DNI:** <span id="carnetDni"></span></p>
                                <p style="margin: 2px 0; font-size: 0.9em;">**ID:** <span id="carnetId"></span></p>
                            </div>
                        </div>
            
                        <svg id="barcodeCanvas"></svg>
                        <p style="font-size: 0.7em; margin-top: 5px;">Presente este código para acceso</p>
                    </div>
            
                    <button id="btnImprimirCarnet" class="btn btn-info" style="width: 100%; margin-top: 10px;">Imprimir Carnet</button>
                </div>
            </div>
            <table id="miembrosTabla" class="tabla-gestion">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Fecha Nac.</th>
                        <th>Foto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <!-- ESTE ES EL QUE USÁS EN JS -->
                <tbody id="tablaBody">
                </tbody>
            </table>

            <div id="paginacion" class="pagination"></div>

        </section>
      <!-- ================= AUTH ================= -->
      <div id="auth-placeholder"></div>
    </main>

    <!-- ================= FOOTER ================= -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="../HTML/JS/index.js"></script>
    <script src="../HTML/JS/loadComponents.js"></script>
    <script src="../HTML/JS/utils.js"></script>
    <script src="../HTML/JS/miembros.js"></script>
</body>
</html>
