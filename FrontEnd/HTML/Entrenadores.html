<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Entrenadores - CuerpoSano</title>
    <link rel="stylesheet" href="../HTML/CSS/style.css" />
</head>
<body>
    
    <!-- ================= HEADER ================= -->
    <div id="header-placeholder"></div>

    <!-- ================= SIDEBAR ================= -->
    <div id="aside-placeholder"></div>

    <!-- ================= OVERLAY ================= -->
    <div id="overlay" class="overlay"></div>

    <main class="main-container content-wrapper">
        <section class="gestor">

        <!-- ===== BOTONES SUPERIORES ===== -->
            <div class="btn-row">
                <button id="abrirEntrenadorBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Nuevo Entrenador</button>
                <h1>Gestión de Entrenadores</h1>
                <button id="buscarEntrenadorBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar Entrenador</button>
            </div>

            <!-- ===== MODAL REGISTRO / MODIFICACIÓN ===== -->
            <div class="modal modal-miembro" id="modalEntrenador">
                <div class="modal-content form-horizontal" id="entrenadorForm">
                    <input type="hidden" id="entrenadorId" />


                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" required placeholder="Ej: Ana"/>
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido:</label>
                            <input type="text" id="apellido" required placeholder="Ej: Gomez"/>
                        </div>
                    </div>


                    <div class="form-row">
                        <div class="form-group">
                            <label for="dni">DNI:</label>
                            <input type="text" id="dni" required placeholder="Ej: 43107996"/>
                        </div>
                        <div class="form-group">
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" required placeholder="Ej: calle x"/>
                        </div>
                    </div>


                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="text" id="telefono" placeholder="Ej: 1122334455"/>
                        </div>
                        <div class="form-group">
                            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                            <input type="date" id="fechaNacimiento" />
                        </div>
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label class="file-label">Foto del Entrenador:</label>

                            <label class="file-upload">
                                <input type="file" id="fotoFile" accept="image/*">
                                <span class="file-btn">Seleccionar foto</span>
                                <span class="file-name" id="fileNameFoto">Ningún archivo seleccionado</span>
                            </label>
                        </div>

                        <div class="form-group">
                            <label class="file-label">Certificado:</label>

                            <label class="file-upload">
                                <input type="file" id="fotoFileCertificado" accept="image/*">
                                <span class="file-btn">Seleccionar foto</span>
                                <span class="file-name" id="fileNameCertificado">Ningún archivo seleccionado</span>
                            </label>
                        </div>
                    </div>

                    <input type="hidden" id="urlFotoEntrenador">
                    <input type="hidden" id="urlCertificadoEntrenador">


                    <div class="btn-group">
                        <button type="button" id="cancelarEntrenadorBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                        <button type="button" id="GuardarEntrenadorBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Guardar</button>
                    </div>
                </div>
            </div>

        <!-- ===== MODAL CONSULTA ===== -->
            <div id="modalConsultaEntrenador" class="modal">
                <div class="modal-content">
                    <h2>Consultar Entrenador</h2>
                    <input type="text" id="consultaDniEntrenador" placeholder="Ingrese DNI del entrenador" />
                    <div class="btn-group">
                        <button id="cancelarConsultaEntrenadorBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                        <button id="confirmarConsultaEntrenadorBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar</button>
                    </div>
                </div>
            </div>

        <!-- ===== MODAL DETALLES ===== -->
            <div id="modalDetalleEntrenador" class="modal">
                <div class="modal-content">
                    <div id="detalleEntrenadorContenido" class="detalle-izquierda"></div>
                    <div class="btn-group">
                        <button id="cerrarDetalleEntrenadorBtn" class="btn-small btn btn-secondary" data-tooltip="Cerrar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
                        </button>
                        <button id="btnEditarEntrenador" class="btn-small btn btn-edit" data-tooltip="Editar Entrenador">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen-line-icon lucide-file-pen-line"><path d="m18.226 5.226-2.52-2.52A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.351"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 18h1"/></svg>
                        </button>
                        <button id="btnEliminarEntrenador" class="btn-small btn btn-delete" data-tooltip="Eliminar Entrenador">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <button id="btnImprimirEntrenador" class="btn-small btn btn-save" data-tooltip="Imprimir PDF">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer-icon lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
                        </button>
                    </div>
                </div>
            </div>

        <!-- ===== LISTADO ===== -->
            <table id="entrenadoresTabla" class="tabla-gestion">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Fecha Nac.</th>
                        <th>Foto</th>
                        <th>Certificado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="paginacion" class="pagination"></div>
        </section>
      <!-- ================= AUTH ================= -->
      <div id="auth-placeholder"></div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../HTML/JS/index.js"></script>
    <script src="../HTML/JS/loadComponents.js"></script>
    <script src="../HTML/JS/entrenadores.js"></script>
    <script src="../HTML/JS/utils.js"></script>
</body>
</html>
