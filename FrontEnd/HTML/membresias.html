<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Membresías - CuerpoSano</title>
    <link rel="stylesheet" href="../HTML/CSS/style.css" />
  </head>

  <body>
    
    <!-- ================= HEADER ================= -->
    <div id="header-placeholder"></div>

    <!-- ================= SIDEBAR ================= -->
    <div id="aside-placeholder"></div>

    <!-- ================= OVERLAY ================= -->
    <div id="overlay" class="overlay"></div>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="main-container content-wrapper">
      <!-- ===== GESTIÓN DE DESCUENTOS ===== -->
      <section class="gestor">

        <!-- ===== BOTONES SUPERIORES ===== -->
        <div class="btn-row">
          <button id="btnRegistrarDesc" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Nuevo Descuento</button>
          <h1>Gestión de Descuentos</h1>
          <button id="btnConsultarDesc" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar Descuento</button>
        </div>

        <!-- ===== MODAL REGISTRO / MODIFICACIÓN ===== -->
        <div id="modalDescuento" class="modal">
          <div class="modal-content" id="descuentoForm">
              <input type="hidden" id="descuentoId" />

              <div class="form-group">
                <label for="descripcionDescuento">Descripción:</label>
                <input type="text" id="descripcionDescuento" required />
              </div>

              <div class="form-group">
                <label for="porcentajeDescuento">Porcentaje (%):</label>
                <input type="number" id="porcentajeDescuento" required />
              </div>

              <div class="btn-group">
                <button type="button" id="cancelarDescuentoBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                <button type="button" id="guardarDescuentoBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Guardar</button>
              </div>
          </div>
        </div>

        <!-- ===== MODAL CONSULTA DESCUENTO ===== -->
        <div id="modalConsultaDescuento" class="modal">
          <div class="modal-content small">
            <h3>Consultar Descuento</h3>
            <input type="text" id="buscarDescuentoInput" placeholder="Nombre o ID del Descuento" />
            <div class="btn-group">
              <button id="cancelarConsultaBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
              <button id="confirmarConsultaDescuentoBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar</button>
            </div>
          </div>
        </div>

        <!-- ===== MODAL DETALLES DESCUENTO ===== -->
        <div id="modalDetalleDescuento" class="modal">
          <div class="modal-content">
            <div id="detalleContenidoDescuento" class="detalle-izquierda"></div>
            <div class="btn-group">
              <button id="btnCerrarDetalleDescuento" class="btn btn-secondary btn-small" data-tooltip="Cerrar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
              </button>
              <button id="btnEliminarDescuento" class="btn btn-delete btn-small" data-tooltip="Eliminar Descuento">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
              <button id="btnEditarDescuento" class="btn btn-edit btn-small" data-tooltip="Editar Descuento">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen-line-icon lucide-file-pen-line"><path d="m18.226 5.226-2.52-2.52A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.351"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 18h1"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ===== LISTADO DE DESCUENTOS ===== -->
        <table id="descuentosTabla" class="tabla-gestion">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descripción</th>
              <th>Porcentaje</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- ===== GESTIÓN DE TIPOS DE MEMBRESÍA ===== -->
      <section class="gestor">

        <!-- ===== BOTONES SUPERIORES ===== -->
        <div class="btn-row">
          <button id="btnRegistrarTipo" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Nuevo Tipo</button>
          <h1>Gestión de Tipos de Membresía</h1>
          <button id="btnConsultarTipo" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar Tipo</button>
        </div>

        <!-- ===== MODAL REGISTRO / MODIFICACIÓN TIPO ===== -->
        <div id="modalTipo" class="modal">
          <div class="modal-content" id="tipoForm">
              <input type="hidden" id="tipoId" />

              <div class="form-group">
                <label for="nombreTipo">Nombre:</label>
                <input type="text" id="nombreTipo" required />
              </div>

              <div class="form-group">
                <label for="duracionTipo">Duración (días):</label>
                <input type="number" id="duracionTipo" required />
              </div>

              <div class="form-group">
                <label for="costoTipo">Costo ($):</label>
                <input type="number" id="costoTipo" required />
              </div>

              <div class="btn-group">
                <button type="button" id="cancelarTipoBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
                <button type="button" id="guardarTipoBtn"class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-save"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Guardar</button>
              </div>
          </div>
        </div>

        <!-- ===== MODAL CONSULTA TIPO ===== -->
        <div id="modalConsultaTipo" class="modal">
          <div class="modal-content small">
            <h3>Consultar Tipo</h3>
            <input type="text" id="buscarTipoInput" placeholder="Nombre o ID del Tipo de Membresía" />
            <div class="btn-group">
              <button id="cancelarConsultaBtn" class="btn btn-secondary svg"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>Cancelar</button>
              <button id="confirmarConsultaTipoBtn" class="btn btn-save svg"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Consultar</button>
            </div>
          </div>
        </div>

        <!-- ===== MODAL DETALLES TIPO ===== -->
        <div id="modalDetalleTipo" class="modal">
          <div class="modal-content">
            <div id="detalleContenidoTipo" class="detalle-izquierda"></div>
            <div class="btn-group">
              <button id="btnCerrarDetalleTipo" class="btn btn-secondary btn-small" data-tooltip="Cerrar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
              </button>
              <button id="btnEditarTipo" class="btn btn-edit btn-small" data-tooltip="Editar Tipo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen-line-icon lucide-file-pen-line"><path d="m18.226 5.226-2.52-2.52A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.351"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 18h1"/></svg>
              </button>
              <button id="btnEliminarTipo" class="btn btn-delete btn-small" data-tooltip="Eliminar Tipo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
              <button id="btnImprimirDetalle" class="btn-small btn btn-save" data-tooltip="Imprimir PDF">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer-icon lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- ===== LISTADO DE TIPOS ===== -->
        <table id="tiposMembresiaTabla" class="tabla-gestion">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Costo</th>
              <th>Duración</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="paginacion" class="pagination"></div>
      </section>
      <!-- ================= HEADER ================= -->
      <div id="auth-placeholder"></div>
    </main>
    
    <!-- ================= FOOTER ================= -->
    <div id="footer-placeholder"></div>

    <!-- ================= SCRIPTS ================= -->
    <script src="../HTML/JS/index.js"></script>
    <script src="../HTML/JS/utils.js"></script>
    <script src="../HTML/JS/membresias.js"></script>
    <script src="../HTML/JS/loadComponents.js"></script>
  </body>
</html>
