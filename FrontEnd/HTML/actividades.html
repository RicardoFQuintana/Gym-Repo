<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Gestión de Actividades - CuerpoSano</title>
    <link rel="stylesheet" href="../HTML/CSS/style.css"> 
  </head> 
  <body> 
    
    <!-- ================= HEADER ================= -->
    <div id="header-placeholder"></div>

    <!-- ================= SIDEBAR ================= -->
    <div id="aside-placeholder"></div>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="main-container">
      <section class="gestor">

        <!-- ===== BOTONES SUPERIORES ===== -->
        <div class="btn-row">
          <button id="abrirActividadBtn" class="btn btn-save">Nueva Actividad</button>
          <h1>Gestión de Actividades</h1>
          <button id="buscarActividadBtn" class="btn btn-save">Consultar Actividad</button>
        </div>
        <!-- ===== MODAL ===== -->
        <div id="modalActividad" class="modal">
          <div class="modal-content" id="actividadForm">
              <input type="hidden" id="actividadId" />

              <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required placeholder="Ej: Yoga Matutino" />
              </div>

              <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" required placeholder="Describe la Actividad..."></textarea>
              </div>

              <div class="btn-group">
                <button type="button" id="cancelarFormBtn" class="btn btn-secondary">Cancelar</button>
                <button type="button"  id="guardarFormBtn" class="btn btn-save">Guardar</button>
              </div>
          </div>
        </div>


        <!-- ===== MODAL CONSULTA (entrada de nombre) ===== -->
        <div id="modalConsulta" class="modal">
          <div class="modal-content small">
            <h2>Consultar Actividad</h2>
            <input type="text" id="consultaNombre" placeholder="Ingrese nombre de la actividad">
            <div class="btn-group">
              <button id="cancelarConsultaBtn" class="btn btn-secondary">Cancelar</button>
              <button id="confirmarConsultaBtn" class="btn btn-save">Consultar</button>
            </div>
          </div>
        </div>

        <!-- ===== MODAL DETALLES DE ACTIVIDAD ===== -->
        <div id="modalDetalle" class="modal">
          <div class="modal-content">
            <div id="detalleContenido" class="detalle-izquierda"></div>
            <div class="btn-group">
              <button id="cerrarDetalleBtn" class="btn-small btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-delete-icon lucide-delete"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
              </button>
              <button id="btnEditarDetalle" class="btn-small btn btn-edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen-line-icon lucide-file-pen-line"><path d="m18.226 5.226-2.52-2.52A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.351"/><path d="M21.378 12.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 18h1"/></svg>
              </button>
              <button id="btnEliminarDetalle" class="btn-small btn btn-delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
              <button id="btnImprimirDetalle" class="btn-small btn btn-save">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer-icon lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
              </button>
            </div>
          </div>
        </div>



        <!-- ============LISTADO============ -->
        <table id="actividadesTabla" class="tabla-gestion">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="paginacion" class="pagination"></div>
      </section>
    </main>
    <!-- ================= FOOTER ================= --> 
    <div id="footer-placeholder"></div>
    <!-- ================= SCRIPT ================= --> 
    <script src="../HTML/JS/actividades.js"></script>
    <script src="../HTML/JS/utils.js"></script>
    <script src="../HTML/JS/index.js"></script> 
    <script src="../HTML/JS/loadComponents.js"></script>
    <!-- Importo todos los íconos -->
    <object type="image/svg+xml" data="../ASSETS/icons/icons.svg" style="display:none;"></object>
  </body> 
</html>
