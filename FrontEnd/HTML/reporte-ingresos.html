<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ingresos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
            line-height: 1.25rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            min-height: 2.5rem;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-icon {
            margin-right: 0.5rem;
        }

        .input-field {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
            min-height: 2.5rem;
        }

        .pagination-btn {
            transition: all 0.2s ease;
        }


        .pagination-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen">
        <aside id="sidebar"
            class="bg-gray-800 text-white w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out z-50">
            <!-- Logo -->
            <div class="flex items-center space-x-2 px-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-dumbbell-icon lucide-dumbbell">
                    <path
                        d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
                    <path d="m2.5 21.5 1.4-1.4" />
                    <path d="m20.1 3.9 1.4-1.4" />
                    <path
                        d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
                    <path d="m9.6 14.4 4.8-4.8" />
                </svg>
                <span class="text-2xl font-extrabold">CuerpoSano</span>
            </div>

            <!-- Navegación -->
            <nav class="space-y-2">
                <a href="clases.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-white hover:bg-gray-600 transition duration-200">
                    <span>Clases</span>
                </a>
                <a href="actividades.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Actividades</span>
                </a>
                <a href="Entrenadores.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Entrenadores</span>
                </a>
                <a href="miembros.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Miembros</span>
                </a>
                <a href="reporte-ingresos.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Reporte de Ingresos</span>
                </a>
                <a href="reporte-asistencia.html"
                    class="flex items-center space-x-2 py-3 px-4 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                    <span>Reporte de Asistencia</span>
                </a>
            </nav>

            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-700">
                <button class="w-full btn btn-danger">Cerrar Sesión</button>
            </div>
        </aside>

        <div id="overlay"
            class="fixed inset-0 bg-black opacity-50 z-40 hidden md:hidden transition-opacity duration-200"></div>

        <div class="flex-1 flex flex-col overflow-hidden">

            <header class="flex md:hidden items-center justify-between px-4 py-3">
                <div class="flex items-center">
                    <button id="menu-toggle" class="text-gray-500 focus:outline-none">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </header>


            <main class="flex-1 p-4 lg:p-6 container mx-auto">
                <div class="flex flex-col space-y-6">
                    <!-- Header -->
                    <div class="flex-1 flex flex-wrap justify-between gap-4">
                        <h1 class="text-3xl font-bold tracking-tight">Reporte de Ingresos</h1>
                        <button class="btn btn-primary mt-2 sm:mt-0" id="generate-report-btn">
                            Exportar PDF
                        </button>
                    </div>
                    <div class="grid gap-6 grid-cols-1 md:grid-cols-3">
                        <div
                            class="p-4 border border-gray-100 rounded-lg bg-white shadow-md card hover:shadow-lg transition-shadow duration-200">
                            <h2 class="text-sm font-medium text-muted-foreground">Ingreso Mensual</h2>
                            <p class="text-2xl font-bold" id="monthly-income">****</p>
                        </div>
                        <div
                            class="p-4 border border-gray-100 rounded-lg bg-white shadow-md card hover:shadow-lg transition-shadow duration-200">
                            <h2 class="text-sm font-medium text-muted-foreground">Ingreso Trimestral</h2>
                            <p class="text-2xl font-bold" id="quarterly-income">****</p>
                        </div>
                        <div
                            class="p-4 border border-gray-100 rounded-lg bg-white shadow-md card hover:shadow-lg transition-shadow duration-200">
                            <h2 class="text-sm font-medium text-muted-foreground">Ingreso Anual</h2>
                            <p class="text-2xl font-bold" id="annual-income">****</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg table-container overflow-hidden">
                        <div
                            class="p-4 border border-gray-100 rounded-lg shadow-md card hover:shadow-lg transition-shadow duration-200">
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead>
                                        <tr>
                                            <th scope="col"
                                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                Miembro</th>
                                            <th scope="col"
                                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                Membresía</th>
                                            <th scope="col"
                                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                Fecha</th>
                                            <th scope="col"
                                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                Método</th>
                                            <th scope="col"
                                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                Monto</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200" id="payments-table-body">
                                    </tbody>
                                </table>
                                <!-- Fila para cuando no hay pagos -->
                                <div id="no-payments-message" class="hidden">
                                    <div class="text-center p-4">
                                        <p class="text-gray-500 mb-4">No hay registros de pagos en el sistema.</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Paginación -->
                            <div
                                class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                                <div class="flex-1 flex justify-between sm:hidden">
                                    <button id="prev-btn-mobile"
                                        class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                        Anterior
                                    </button>
                                    <button id="next-btn-mobile"
                                        class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                        Siguiente
                                    </button>
                                </div>
                                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                                    <div>
                                        <p id="pagination-info" class="text-sm text-gray-700">
                                            Mostrando <span id="start-record" class="font-medium">0</span> a
                                            <span id="end-record" class="font-medium">0</span> de
                                            <span id="total-records" class="font-medium">0</span> resultados
                                        </p>
                                    </div>
                                    <div>
                                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px"
                                            aria-label="Pagination">
                                            <button id="first-page"
                                                class="pagination-btn relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 disabled:opacity-50 disabled:cursor-not-allowed">
                                                <span class="sr-only">Primera</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                    class="lucide lucide-chevrons-left-icon lucide-chevrons-left">
                                                    <path d="m11 17-5-5 5-5" />
                                                    <path d="m18 17-5-5 5-5" />
                                                </svg>
                                            </button>
                                            <!-- <button id="prev-page"
                                    class="pagination-btn relative inline-flex items-center px-2 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-500 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <span class="sr-only">Anterior</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
                                </button> -->

                                            <div id="pagination-numbers" class="flex">
                                                <!-- Los números de página se generarán dinámicamente -->
                                            </div>

                                            <!-- <button id="next-page"
                                    class="pagination-btn relative inline-flex items-center px-2 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-500 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <span class="sr-only">Siguiente</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                                </button> -->
                                            <button id="last-page"
                                                class="pagination-btn relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 disabled:opacity-50 disabled:cursor-not-allowed">
                                                <span class="sr-only">Última</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                    class="lucide lucide-chevrons-right-icon lucide-chevrons-right">
                                                    <path d="m6 17 5-5-5-5" />
                                                    <path d="m13 17 5-5-5-5" />
                                                </svg>
                                            </button>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../HTML/JS/reporte-ingresos.js"></script>
    <script>
        // Toggle del menú móvil
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

        // Cerrar menú al hacer clic en un enlace (en móvil)
        const navLinks = document.querySelectorAll('aside nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            });
        });
    </script>
</body>

</html>
